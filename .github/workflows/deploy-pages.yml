name: Webblocks Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/reusable-pages.yml
    with:
      working_directory: ${{ vars.WEBBLOCKS_WORKING_DIRECTORY || '.' }}
