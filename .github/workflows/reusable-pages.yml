name: Reusable Webblocks Pages deployment

on:
  workflow_call:
    inputs:
      working_directory:
        description: Webblocks directory relative to the caller repository root
        type: string
        default: '.'
    outputs:
      page_url:
        description: Published Pages URL
        value: ${{ jobs.deploy.outputs.page_url }}

permissions: {}

# Serialize production in the caller repository, even across caller workflows.
concurrency:
  group: webblocks-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Read caller Pages configuration
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Read GitHub Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

  build:
    name: Qualify production Pages build
    needs: metadata
    if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-build.yml
    with:
      working_directory: ${{ inputs.working_directory }}
      publish_pages: true
      pages_base_url: ${{ needs.metadata.outputs.base_url }}
      pages_base_path: ${{ needs.metadata.outputs.base_path }}

  deploy:
    name: Publish qualified Pages artifact
    needs: build
    if: ${{ success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # No checkout, package installation or execution of repository code in this job.
      - name: Reject superseded or non-default-branch revisions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          test "$GITHUB_REF" = "refs/heads/$default_branch"
          head=$(gh api --method GET "repos/$GITHUB_REPOSITORY/commits" -f sha="$default_branch" -f per_page=1 --jq '.[0].sha')
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo '::error::This revision is no longer the default branch head. Run the workflow from the current default branch.'
            exit 1
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
