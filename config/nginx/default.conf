server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;

    # Missing static files must not be replaced with the SPA HTML.
    location ~* ^/(assets|characters|controller|gen_util)(/|$) {
        try_files $uri =404;
    }
    location ~ \.[^/]+$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
